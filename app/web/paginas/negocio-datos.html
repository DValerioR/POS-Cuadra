<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Datos del negocio · POS</title>
  <link rel="icon" href="/static/app/icono-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/static/app/icono-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/static/app/icono-180.png">
  <link rel="manifest" href="/static/app/manifest.webmanifest">
  <meta name="theme-color" content="#0a4d40">
  <link rel="stylesheet" href="/static/css/pos.css">
  <script src="/static/js/api.js"></script>
  <script src="/static/js/horario-negocio.js"></script>
  <script>
    // Datos del negocio (solo administradores): nombre, datos fiscales (para
    // facturar más adelante), textos del ticket con vista previa y redondeo.
    const REGIMENES = {
      "601": "General de Ley Personas Morales",
      "603": "Personas Morales con Fines no Lucrativos",
      "605": "Sueldos y Salarios",
      "606": "Arrendamiento",
      "612": "Personas Físicas con Actividades Empresariales y Profesionales",
      "621": "Incorporación Fiscal",
      "625": "Actividades Empresariales con ingresos a través de Plataformas Tecnológicas",
      "626": "Régimen Simplificado de Confianza",
    };
    const ANCHO_TICKET = 42;
    const FORMAS_PAGO = ["Efectivo", "Tarjeta de débito", "Tarjeta de crédito", "Transferencia"];

    function pantallaNegocio() {
      return {
        ...horarioNegocio(),
        usuario: null,
        cargando: true,
        error: "",
        aviso: "",
        guardando: false,
        subiendo: false,
        original: null,
        f: null,
        regimenes: REGIMENES,
        formasPago: FORMAS_PAGO,

        async init() {
          try {
            this.usuario = await API.get("/auth/yo");
            if (this.esAdmin) this.cargar(await API.get("/negocio"));
          } catch (e) {
            this.error = e.message;
          } finally {
            this.cargando = false;
          }
        },
        get esAdmin() {
          return this.usuario && this.usuario.rol === "admin";
        },
        cargar(n) {
          this.original = n;
          this.f = {
            nombre: n.nombre, razon_social: n.razon_social || "", rfc: n.rfc || "", regimen_fiscal: n.regimen_fiscal || "",
            codigo_postal: n.codigo_postal || "", ticket_encabezado: n.ticket_encabezado || "", ticket_pie: n.ticket_pie || "", ticket_logo: n.ticket_logo, marca_url: n.marca_url,
            redondeo: n.redondeo_precio_venta === null ? "" : String(Number(n.redondeo_precio_venta)),
            horario: horarioAEditar(n.horario),
            direccion: n.direccion || "", ubicacion_url: n.ubicacion_url || "", telefono: n.telefono || "",
            formas: (n.formas_pago || []).filter((x) => FORMAS_PAGO.includes(x)),
            otras_formas: (n.formas_pago || []).filter((x) => !FORMAS_PAGO.includes(x)).join(", "),
          };
        },
        get cambios() {
          if (!this.f || !this.original) return false;
          const o = this.original;
          const r = o.redondeo_precio_venta === null ? "" : String(Number(o.redondeo_precio_venta));
          return this.f.nombre !== o.nombre || this.f.razon_social !== (o.razon_social || "") || this.f.rfc !== (o.rfc || "") ||
            this.f.regimen_fiscal !== (o.regimen_fiscal || "") || this.f.codigo_postal !== (o.codigo_postal || "") ||
            this.f.ticket_encabezado !== (o.ticket_encabezado || "") || this.f.ticket_pie !== (o.ticket_pie || "") || this.f.redondeo !== r || this.f.ticket_logo !== o.ticket_logo ||
            JSON.stringify(horarioAGuardar(this.f.horario)) !== JSON.stringify(horarioAGuardar(horarioAEditar(o.horario))) ||
            this.f.direccion !== (o.direccion || "") || this.f.ubicacion_url !== (o.ubicacion_url || "") || this.f.telefono !== (o.telefono || "") ||
            JSON.stringify(this.formasAGuardar()) !== JSON.stringify(o.formas_pago || null);
        },
        async guardar() {
          const f = this.f;
          if (!f.nombre.trim()) return (this.error = "El negocio necesita un nombre.");
          if (f.horario && f.horario.especiales.some((e) => !e.fecha)) return (this.error = "A un día especial le falta la fecha.");
          if (f.horario && f.horario.especiales.some((e) => !e.cerrado && !e.tarde && !e.temprano))
            return (this.error = "En cada día especial marca si entran más tarde, salen más temprano o no se abre.");
          this.guardando = true;
          this.error = "";
          try {
            const n = await API.put("/negocio", {
              nombre: f.nombre.trim(),
              razon_social: f.razon_social.trim() || null,
              rfc: f.rfc.trim() || null,
              regimen_fiscal: f.regimen_fiscal || null,
              codigo_postal: f.codigo_postal.trim() || null,
              ticket_encabezado: f.ticket_encabezado.trim() || null,
              ticket_pie: f.ticket_pie.trim() || null,
              ticket_logo: f.ticket_logo,
              redondeo_precio_venta: f.redondeo || null,
              ...(f.horario ? { horario: horarioAGuardar(f.horario) } : {}),
              direccion: f.direccion.trim() || null,
              ubicacion_url: f.ubicacion_url.trim() || null,
              telefono: f.telefono.trim() || null,
              formas_pago: this.formasAGuardar(),
            });
            this.cargar(n);
            document.querySelectorAll("[data-negocio]").forEach((e) => (e.textContent = n.nombre));
            this.avisar("Listo: se guardaron los datos del negocio.");
          } catch (e) {
            this.error = e.message;
            window.scrollTo(0, 0);
          } finally {
            this.guardando = false;
          }
        },
        // Formas de pago en el orden de la lista, más las que se escribieron aparte.
        formasAGuardar() {
          const lista = FORMAS_PAGO.filter((x) => this.f.formas.includes(x))
            .concat(this.f.otras_formas.split(",").map((x) => x.trim()).filter(Boolean));
          return lista.length ? lista : null;
        },
        // Vista previa aproximada del ticket (texto centrado a 42 columnas).
        centrar(texto) {
          const t = texto.slice(0, ANCHO_TICKET);
          return " ".repeat(Math.max(0, Math.floor((ANCHO_TICKET - t.length) / 2))) + t;
        },
        renglon(izq, der) {
          return izq.slice(0, ANCHO_TICKET - der.length - 1).padEnd(ANCHO_TICKET - der.length) + der;
        },
        get ticket() {
          if (!this.f) return "";
          const lineas = [this.centrar(this.f.nombre.toUpperCase())];
          for (const l of this.f.ticket_encabezado.split("\n")) if (l.trim()) lineas.push(this.centrar(l.trim()));
          lineas.push("", this.renglon("Folio 1234", "29/09/2026 10:30"), "-".repeat(ANCHO_TICKET),
                      this.renglon("2 PARACETAMOL 500MG C/10", "$70.00"), this.renglon("1 SHAMPOO 400ML", "$116.00"),
                      "-".repeat(ANCHO_TICKET), this.renglon("TOTAL", "$186.00"), "");
          for (const l of this.f.ticket_pie.split("\n")) if (l.trim()) lineas.push(this.centrar(l.trim()));
          return lineas.join("\n");
        },
        // El logo se guarda al elegirlo (no espera al botón Guardar).
        async subirLogo(ev) {
          const archivo = ev.target.files[0];
          ev.target.value = "";
          if (!archivo) return;
          this.subiendo = true;
          this.error = "";
          try {
            const n = await API.put("/negocio/marca", archivo);
            this.original.marca_url = n.marca_url;
            this.f.marca_url = n.marca_url;
            ponerLogo(document.querySelector(".barra .marca .logo"), n.marca_url);
            this.avisar("Listo: se cambió el logo de la farmacia.");
          } catch (e) {
            this.error = e.message;
          } finally {
            this.subiendo = false;
          }
        },
        async quitarLogo() {
          try {
            await API.pedir("DELETE", "/negocio/marca");
            this.original.marca_url = this.f.marca_url = null;
            this.avisar("Se quitó el logo; vuelve a mostrarse la cruz.");
          } catch (e) {
            this.error = e.message;
          }
        },
        avisar(texto) {
          this.aviso = texto;
          clearTimeout(this._aviso);
          this._aviso = setTimeout(() => (this.aviso = ""), 4000);
        },
      };
    }
  </script>
  <script defer src="/static/vendor/alpine-3.17.4.min.js"></script>
</head>
<body x-data="pantallaNegocio()">

  <header class="barra" data-pagina="negocio"></header>

  <main class="contenido negocio-datos" x-cloak x-show="!cargando">
    <div class="mensaje error" x-show="error"><svg class="ico"><use href="/static/iconos.svg#alerta"/></svg><span x-text="error"></span></div>

    <template x-if="usuario && !esAdmin">
      <div class="panel"><div class="encabezado">
        <span class="circulo"><svg><use href="/static/iconos.svg#candado"/></svg></span>
        <div><h2>Sin acceso</h2><p class="suave">Los datos del negocio los cambia un administrador.</p></div>
      </div></div>
    </template>

    <template x-if="esAdmin && f">
      <form class="pila" style="gap: 16px" @submit.prevent="guardar()">
        <div class="encabezado" style="margin: 0">
          <span class="circulo"><svg><use href="/static/iconos.svg#tienda"/></svg></span>
          <div><h1>Datos del negocio</h1><p class="suave">Nombre, horario, datos fiscales, ticket y redondeo de precios.</p></div>
        </div>

        <div class="panel">
          <div class="paso" style="margin-top: 0">Negocio</div>
          <label style="margin-top: 0">Nombre <span class="ayuda">(sale en la barra, en Inicio y arriba del ticket)</span></label>
          <input x-model="f.nombre" maxlength="80">
        </div>

        <div class="panel horario-negocio">
          <div class="paso" style="margin-top: 0">Horario de atención</div>
          <p class="suave" style="margin-top: 0">Horario corrido o por turnos (a qué hora se abre cada uno). El bot de WhatsApp lo usa para contestar a qué hora abren y para no confirmar encargos fuera de horario.</p>

          <template x-if="!f.horario">
            <div class="fila" style="gap: 12px; flex-wrap: wrap">
              <span class="suave">Todavía no hay horario.</span>
              <button type="button" style="flex: 0 0 auto" @click="capturarHorario()">Capturar el horario</button>
            </div>
          </template>

          <template x-if="f.horario">
            <div>
              <div class="interruptor" style="margin-bottom: 14px">
                <button type="button" :class="{ activo: f.horario.modo === 'corrido' }" @click="cambiarModo('corrido')">Horario corrido</button>
                <button type="button" :class="{ activo: f.horario.modo === 'turnos' }" @click="cambiarModo('turnos')">Por turnos</button>
              </div>

              <template x-if="f.horario.modo === 'turnos'">
                <div class="turnos-nombres">
                  <span class="suave">Turnos:</span>
                  <template x-for="(nombre, i) in f.horario.turnos" :key="i">
                    <span class="turno-nombre">
                      <input x-model="f.horario.turnos[i]" maxlength="30" aria-label="Nombre del turno">
                      <button type="button" class="texto-peligro" x-show="f.horario.turnos.length > 1" title="Quitar este turno" @click="quitarTurno(i)">✕</button>
                    </span>
                  </template>
                  <button type="button" class="enlace" x-show="f.horario.turnos.length < 4" @click="agregarTurno()">+ Agregar turno</button>
                </div>
              </template>

              <div class="horario-semana">
                <template x-for="d in dias" :key="d">
                  <div class="horario-dia" :class="{ cerrado: !f.horario.dias[d].some((c) => c.activo) }">
                    <strong class="nombre-dia" x-text="nombreDia(d)"></strong>
                    <div class="turnos">
                      <template x-for="(c, i) in f.horario.dias[d]" :key="i">
                        <span class="turno" :class="{ apagado: !c.activo }">
                          <label class="casilla">
                            <input type="checkbox" x-model="c.activo">
                            <span x-text="f.horario.modo === 'turnos' ? (f.horario.turnos[i] || 'Turno') : (c.activo ? 'Abierto' : 'Cerrado')"></span>
                          </label>
                          <template x-if="c.activo">
                            <span class="horas"><input type="time" x-model="c.abre" aria-label="Abre"><span>a</span><input type="time" x-model="c.cierra" aria-label="Cierra"></span>
                          </template>
                        </span>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
              <button type="button" style="margin-top: 10px" @click="copiarLunes()">Copiar el lunes de martes a viernes</button>

              <div class="paso">Días especiales <span class="ayuda">(festivos, inventario… cambian la entrada o la salida solo esa fecha)</span></div>
              <p class="suave" style="margin-top: 0">Marca un día de esta semana:</p>
              <div class="semana-actual">
                <template x-for="dia in semanaActual()" :key="dia.fecha">
                  <button type="button" :disabled="dia.pasado" :class="{ hoy: dia.hoy, marcado: dia.especial }"
                          :title="dia.especial ? 'Ya es día especial' : 'Marcar como día especial'" @click="agregarEspecial(dia.fecha)">
                    <span x-text="dia.corto"></span><strong x-text="dia.numero"></strong>
                  </button>
                </template>
                <button type="button" class="otra-fecha" @click="agregarEspecial()">Otra fecha…</button>
              </div>

              <template x-for="(e, i) in f.horario.especiales" :key="i">
                <div class="dia-especial" :class="{ cerrado: e.cerrado }">
                  <div class="cabeza">
                    <input type="date" x-model="e.fecha" @change="proponerHoras(e)" aria-label="Fecha">
                    <strong x-text="fechaLarga(e.fecha)"></strong>
                    <input x-model="e.nota" maxlength="80" placeholder="Motivo (opcional)">
                    <button type="button" class="texto-peligro" @click="f.horario.especiales.splice(i, 1)">Quitar</button>
                  </div>
                  <div class="reglas">
                    <label class="casilla" :class="{ apagada: e.cerrado }">
                      <input type="checkbox" x-model="e.tarde" :disabled="e.cerrado"><span>Entramos más tarde, a las</span>
                    </label>
                    <input type="time" x-model="e.abre" :disabled="e.cerrado || !e.tarde" aria-label="Hora de entrada">
                    <label class="casilla" :class="{ apagada: e.cerrado }">
                      <input type="checkbox" x-model="e.temprano" :disabled="e.cerrado"><span>Salimos más temprano, a las</span>
                    </label>
                    <input type="time" x-model="e.cierra" :disabled="e.cerrado || !e.temprano" aria-label="Hora de salida">
                    <label class="casilla"><input type="checkbox" x-model="e.cerrado"><span>No se abre ese día</span></label>
                  </div>
                  <p class="resultado" x-text="resultadoEspecial(e)"></p>
                </div>
              </template>

              <div class="mensaje info" style="margin-top: 14px"><span><strong>Así lo dirá el bot:</strong> <span x-text="horarioTexto()"></span></span></div>
            </div>
          </template>
        </div>

        <div class="panel">
          <div class="paso" style="margin-top: 0">Información para clientes <span class="ayuda">(la da el bot de WhatsApp)</span></div>
          <label style="margin-top: 0">Dirección</label>
          <textarea rows="2" x-model="f.direccion" maxlength="300" placeholder="Calle, número, colonia, ciudad"></textarea>
          <div class="rejilla-2">
            <div><label>Liga de ubicación <span class="ayuda">(Google Maps → Compartir → Copiar vínculo)</span></label>
              <input x-model="f.ubicacion_url" maxlength="500" placeholder="https://maps.app.goo.gl/…"></div>
            <div><label>Teléfono</label><input x-model="f.telefono" maxlength="40" inputmode="tel"></div>
          </div>
          <label>Formas de pago</label>
          <div class="fila" style="gap: 6px 18px; flex-wrap: wrap">
            <template x-for="forma in formasPago" :key="forma">
              <label class="casilla" style="margin: 0"><input type="checkbox" :value="forma" x-model="f.formas"><span x-text="forma"></span></label>
            </template>
          </div>
          <input x-model="f.otras_formas" maxlength="200" placeholder="Otras, separadas por coma (ej. vales de despensa)" style="margin-top: 8px">
        </div>

        <div class="panel logo-farmacia">
          <div class="vista-logo">
            <img x-show="f.marca_url" :src="f.marca_url" alt="Logo de la farmacia">
            <span class="suave" x-show="!f.marca_url">Sin logo</span>
          </div>
          <div>
            <div class="paso" style="margin-top: 0">Logo de la farmacia</div>
            <p class="suave" style="margin-top: 0">Sale arriba a la izquierda en todas las pantallas, al iniciar sesión, en la tableta y, si quieres, en el ticket. La imagen del centro de Inicio es aparte (Configuración → Imagen de inicio).</p>
            <div class="fila" style="gap: 8px; flex-wrap: wrap">
              <label class="boton" style="flex: 0 0 auto; margin: 0" :class="{ apagado: subiendo }">
                <input type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden @change="subirLogo($event)">
                <span x-text="subiendo ? 'Subiendo…' : (f.marca_url ? 'Cambiar logo' : 'Subir logo')"></span>
              </label>
              <button type="button" class="texto-peligro" style="flex: 0 0 auto" x-show="f.marca_url" @click="quitarLogo()">Quitar</button>
            </div>
            <p class="ayuda" style="margin-bottom: 0">PNG o JPG. Si tiene fondo blanco alrededor, se quita solo.</p>
          </div>
        </div>

        <div class="panel">
          <div class="paso" style="margin-top: 0">Datos fiscales <span class="ayuda">(los de sus facturas; se usarán al facturar desde el sistema)</span></div>
          <label style="margin-top: 0">Razón social</label>
          <input x-model="f.razon_social" maxlength="200" placeholder="Como aparece en la constancia de situación fiscal">
          <div class="rejilla-2">
            <div><label>RFC</label><input x-model="f.rfc" maxlength="13" autocapitalize="characters" placeholder="12 o 13 caracteres"></div>
            <div><label>Código postal <span class="ayuda">(lugar de expedición)</span></label><input x-model="f.codigo_postal" maxlength="5" inputmode="numeric"></div>
          </div>
          <label>Régimen fiscal</label>
          <select x-model="f.regimen_fiscal">
            <option value="">Sin elegir</option>
            <template x-for="(texto, clave) in regimenes" :key="clave">
              <option :value="clave" x-text="`${clave} - ${texto}`" :selected="clave === f.regimen_fiscal"></option>
            </template>
          </select>
        </div>

        <div class="panel ticket-negocio">
          <div>
            <div class="paso" style="margin-top: 0">Ticket</div>
            <label style="margin-top: 0">Arriba <span class="ayuda">(dirección, teléfono, RFC…; una línea por renglón)</span></label>
            <textarea rows="4" x-model="f.ticket_encabezado" maxlength="500"></textarea>
            <label>Abajo <span class="ayuda">(agradecimiento, horario, redes…)</span></label>
            <textarea rows="3" x-model="f.ticket_pie" maxlength="300"></textarea>
            <label class="casilla" :class="{ apagada: !f.marca_url }" style="margin-top: 14px">
              <input type="checkbox" x-model="f.ticket_logo" :disabled="!f.marca_url">
              <span>Poner el logo arriba del ticket <span class="ayuda" x-text="f.marca_url ? '(en blanco y negro)' : '(primero sube el logo de la farmacia, arriba)'"></span></span>
            </label>
          </div>
          <div>
            <div class="paso" style="margin-top: 0">Así se verá <span class="ayuda">(aproximado)</span></div>
            <div class="vista-ticket-papel">
              <img class="vista-ticket-logo" x-show="f.ticket_logo && f.marca_url" :src="f.marca_url && `/negocio/marca-ticket?${f.marca_url.split('?')[1] || ''}`" alt="">
              <pre class="vista-ticket" x-text="ticket"></pre>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="paso" style="margin-top: 0">Redondeo de precios de venta</div>
          <p class="suave" style="margin-top: 0">Al calcular un precio (por margen o al cambiar impuestos) se redondea hacia arriba, sin pasar del precio máximo al público.</p>
          <div class="interruptor">
            <button type="button" :class="{ activo: f.redondeo === '' }" @click="f.redondeo = ''">Sin redondeo</button>
            <button type="button" :class="{ activo: f.redondeo === '0.5' }" @click="f.redondeo = '0.5'">A 50 centavos</button>
            <button type="button" :class="{ activo: f.redondeo === '1' }" @click="f.redondeo = '1'">A pesos enteros</button>
          </div>
        </div>

        <div class="panel acciones-pedido">
          <span class="suave" x-text="cambios ? 'Hay cambios sin guardar.' : 'Todo guardado.'"></span>
          <button class="primario" style="flex: 0 0 auto" :disabled="guardando || !cambios" x-text="guardando ? 'Guardando…' : 'Guardar'"></button>
        </div>
      </form>
    </template>
  </main>

  <div class="aviso-flotante" x-show="aviso" x-transition.opacity x-cloak>
    <svg class="ico"><use href="/static/iconos.svg#palomita"/></svg><span x-text="aviso"></span>
  </div>
</body>
</html>
