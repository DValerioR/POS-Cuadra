<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turno y corte · POS</title>
  <link rel="icon" href="/static/app/icono-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/static/app/icono-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/static/app/icono-180.png">
  <link rel="manifest" href="/static/app/manifest.webmanifest">
  <meta name="theme-color" content="#0a4d40">
  <link rel="stylesheet" href="/static/css/pos.css">
  <script src="/static/js/api.js"></script>
  <script defer src="/static/vendor/alpine-3.17.4.min.js"></script>
</head>
<body x-data="pantallaTurno()">

  <header class="barra" data-pagina="turno"></header>

  <main class="contenido corte" x-cloak x-show="!cargando">
    <div class="mensaje error" x-show="error">
      <svg class="ico"><use href="/static/iconos.svg#alerta"/></svg><span x-text="error"></span>
    </div>

    <template x-if="!cajaId">
      <div class="panel">
        <div class="encabezado">
          <span class="circulo"><svg><use href="/static/iconos.svg#caja"/></svg></span>
          <div><h2>Esta computadora no tiene caja</h2><p class="suave">Entra a Vender para elegir qué caja es.</p></div>
        </div>
        <a class="boton primario grande" href="/venta">Ir a Vender</a>
      </div>
    </template>

    <!-- Turno cerrado: resultado del corte -->
    <template x-if="cerrado">
      <div class="panel">
        <div class="encabezado">
          <span class="circulo"><svg><use href="/static/iconos.svg#palomita"/></svg></span>
          <div><h2>Turno cerrado</h2><p class="suave" x-text="cajaNombre"></p></div>
        </div>
        <div class="pila">
          <div class="veredicto" :class="claseDiferencia(cerrado.diferencia_efectivo)">
            <svg class="ico"><use href="/static/iconos.svg#billete"/></svg>
            <span x-text="'Efectivo: ' + textoDiferencia(cerrado.diferencia_efectivo)"></span>
          </div>
          <div class="veredicto" :class="claseDiferencia(cerrado.diferencia_tarjeta)">
            <svg class="ico"><use href="/static/iconos.svg#tarjeta"/></svg>
            <span x-text="'Tarjeta: ' + textoDiferencia(cerrado.diferencia_tarjeta)"></span>
          </div>
        </div>
        <details class="desglose">
          <summary>Ver cifras</summary>
          <table>
            <tr><td>Efectivo que debía haber</td><td x-text="dinero(cerrado.efectivo_esperado)"></td></tr>
            <tr><td>Efectivo contado</td><td x-text="dinero(cerrado.efectivo_contado)"></td></tr>
            <tr><td>Tarjeta que debía haber</td><td x-text="dinero(cerrado.tarjeta_esperado)"></td></tr>
            <tr><td>Tarjeta contada</td><td x-text="dinero(cerrado.tarjeta_contado)"></td></tr>
          </table>
        </details>
        <a class="boton primario grande separado" href="/venta">Abrir el siguiente turno</a>
      </div>
    </template>

    <template x-if="cajaId && !turno && !cerrado">
      <div class="panel">
        <div class="encabezado">
          <span class="circulo"><svg><use href="/static/iconos.svg#caja"/></svg></span>
          <div><h2>No hay turno abierto</h2><p class="suave" x-text="cajaNombre"></p></div>
        </div>
        <a class="boton primario grande" href="/venta">Abrir turno</a>
      </div>
    </template>

    <!-- Turno abierto: corte -->
    <template x-if="turno && corte">
      <div class="panel">
        <div class="encabezado">
          <span class="circulo"><svg><use :href="turno.tipo === 'manana' ? '/static/iconos.svg#sol' : '/static/iconos.svg#atardecer'"/></svg></span>
          <div>
            <h2>Corte de caja</h2>
            <p class="suave">
              <span x-text="cajaNombre"></span> · turno de la <span x-text="turno.tipo === 'manana' ? 'mañana' : 'tarde'"></span>,
              desde las <span x-text="new Date(turno.abierto_en).toLocaleTimeString('es-MX', { hour: 'numeric', minute: '2-digit' })"></span>
            </p>
          </div>
        </div>

        <!-- Lo que impide hacer el corte (ventas guardadas en esta caja) -->
        <template x-for="p in pendientes" :key="p">
          <div class="mensaje aviso" style="margin-top: 0">
            <svg class="ico"><use href="/static/iconos.svg#alerta"/></svg>
            <span><span x-text="p"></span> <a href="/venta">Ir a Vender</a></span>
          </div>
        </template>

        <div class="paso">1. Lo que debe haber</div>
        <div class="cifras">
          <div class="cifra">
            <div class="rotulo"><svg class="ico"><use href="/static/iconos.svg#billete"/></svg>Efectivo en caja</div>
            <div class="valor" x-text="dinero(corte.efectivo_esperado)"></div>
          </div>
          <div class="cifra">
            <div class="rotulo"><svg class="ico"><use href="/static/iconos.svg#tarjeta"/></svg>Tarjeta</div>
            <div class="valor" x-text="dinero(corte.tarjeta_esperado)"></div>
          </div>
        </div>
        <details class="desglose">
          <summary>¿De dónde salen estas cifras?</summary>
          <table>
            <tr><td>Fondo inicial</td><td x-text="dinero(corte.fondo_inicial)"></td></tr>
            <tr><td>Ventas en efectivo</td><td x-text="'+ ' + dinero(corte.ventas_efectivo)"></td></tr>
            <tr x-show="Number(corte.reembolsos_efectivo)"><td>Devoluciones en efectivo</td><td x-text="'− ' + dinero(corte.reembolsos_efectivo)"></td></tr>
            <tr class="total-fila"><td>Efectivo esperado</td><td x-text="dinero(corte.efectivo_esperado)"></td></tr>
            <tr><td>Ventas con tarjeta</td><td x-text="dinero(corte.ventas_tarjeta)"></td></tr>
            <tr x-show="Number(corte.reembolsos_tarjeta)"><td>Devoluciones a tarjeta</td><td x-text="'− ' + dinero(corte.reembolsos_tarjeta)"></td></tr>
            <tr class="total-fila"><td>Tarjeta esperada</td><td x-text="dinero(corte.tarjeta_esperado)"></td></tr>
          </table>
        </details>

        <form @submit.prevent="cerrar">
          <div class="paso separado">2. Cuenta lo que hay</div>
          <div class="fila" style="align-items: flex-start">
            <div>
              <label style="margin-top: 0">Efectivo en el cajón</label>
              <div class="campo-dinero"><input type="number" min="0" step="0.50" x-model="contado.efectivo" placeholder="0.00" required></div>
            </div>
            <div>
              <label style="margin-top: 0">Suma de los vouchers de tarjeta</label>
              <div class="campo-dinero"><input type="number" min="0" step="0.01" x-model="contado.tarjeta" placeholder="0.00" required></div>
            </div>
          </div>

          <div class="pila separado" x-show="contado.efectivo !== '' || contado.tarjeta !== ''">
            <div class="veredicto" x-show="contado.efectivo !== ''" :class="claseDiferencia(diferenciaPrevia)">
              <svg class="ico"><use href="/static/iconos.svg#billete"/></svg>
              <span x-text="'Efectivo: ' + textoDiferencia(diferenciaPrevia)"></span>
            </div>
            <div class="veredicto" x-show="contado.tarjeta !== ''" :class="claseDiferencia(diferenciaTarjetaPrevia)">
              <svg class="ico"><use href="/static/iconos.svg#tarjeta"/></svg>
              <span x-text="'Tarjeta: ' + textoDiferencia(diferenciaTarjetaPrevia)"></span>
            </div>
          </div>

          <label>Notas <span class="ayuda">(opcional)</span></label>
          <textarea rows="2" x-model="contado.notas" placeholder="Ej. faltó un billete de $20"></textarea>
          <button class="primario grande separado pegado-abajo" :disabled="cerrando || pendientes.length > 0">
            <span x-text="cerrando ? 'Cerrando…' : 'Cerrar turno'"></span>
          </button>
        </form>
      </div>
    </template>
  </main>

  <script>
    function pantallaTurno() {
      return {
        usuario: null,
        cajaId: CajaLocal.obtener(),
        cajas: [],
        turno: null,
        corte: null,
        cerrado: null,
        contado: { efectivo: "", tarjeta: "", notas: "" },
        cargando: true,
        cerrando: false,
        error: "",
        pendientes: [], // por qué no se puede hacer el corte todavía

        async init() {
          try {
            this.usuario = await API.get("/auth/yo");
            this.cajas = await API.get("/cajas");
            if (this.cajaId) {
              this.turno = await API.get(`/turnos/abierto?caja_id=${this.cajaId}`);
              if (this.turno) {
                this.corte = await API.get(`/turnos/${this.turno.id}/corte`);
                await this.revisarPendientes();
              }
            }
          } catch (e) {
            this.error = e.message;
          } finally {
            this.cargando = false;
          }
        },

        async revisarPendientes() {
          const [espera, solicitudes] = await Promise.all([
            API.get(`/ventas-en-espera?caja_id=${this.cajaId}`),
            API.get(`/solicitudes/caja/${this.cajaId}`),
          ]);
          const guardadas = espera.length;
          const porAutorizar = solicitudes.filter((s) => s.estado === "pendiente").length;
          this.pendientes = [];
          if (guardadas) {
            this.pendientes.push(`Hay ${guardadas === 1 ? "una venta guardada" : `${guardadas} ventas guardadas`} en esta caja: ` +
              "cóbralas o bórralas antes de hacer el corte.");
          }
          if (porAutorizar) {
            this.pendientes.push(`Hay ${porAutorizar === 1 ? "una devolución" : `${porAutorizar} devoluciones`} de esta caja ` +
              "esperando que un administrador la responda; el dinero saldría de este turno.");
          }
        },

        get cajaNombre() {
          const caja = this.cajas.find((c) => c.id === this.cajaId);
          return caja ? caja.nombre : "";
        },
        get diferenciaPrevia() {
          return (centavos(this.contado.efectivo) - centavos(this.corte.efectivo_esperado)) / 100;
        },
        get diferenciaTarjetaPrevia() {
          return (centavos(this.contado.tarjeta) - centavos(this.corte.tarjeta_esperado)) / 100;
        },

        claseDiferencia(valor) {
          const n = Number(valor);
          return n < 0 ? "diferencia-negativa" : n > 0 ? "diferencia-positiva" : "diferencia-cero";
        },
        textoDiferencia(valor) {
          const n = Number(valor);
          if (n === 0) return "cuadra exacto";
          return n < 0 ? `faltan ${dinero(-n)}` : `sobran ${dinero(n)}`;
        },

        async cerrar() {
          if (!confirm("¿Cerrar el turno? Después ya no se pueden cobrar ventas en él.")) return;
          this.cerrando = true;
          this.error = "";
          try {
            this.cerrado = await API.post(`/turnos/${this.turno.id}/cerrar`, {
              efectivo_contado: this.contado.efectivo || "0",
              tarjeta_contado: this.contado.tarjeta || "0",
              notas: this.contado.notas || null,
            });
            this.turno = null;
          } catch (e) {
            this.error = e.message;
          } finally {
            this.cerrando = false;
          }
        },

        dinero,
      };
    }
  </script>
</body>
</html>
