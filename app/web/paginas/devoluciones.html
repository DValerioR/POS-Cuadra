<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Devoluciones · POS</title>
  <link rel="stylesheet" href="/static/css/pos.css">
  <script src="/static/js/api.js"></script>
  <script src="/static/js/devoluciones.js"></script>
  <script defer src="/static/vendor/alpine-3.17.4.min.js"></script>
</head>
<body x-data="pantallaDevoluciones()">

  <header class="barra" data-pagina="devoluciones"></header>

  <main class="contenido devoluciones" x-cloak x-show="!cargando">

    <template x-if="usuario && !esAdmin">
      <div class="panel">
        <div class="encabezado">
          <span class="circulo"><svg><use href="/static/iconos.svg#candado"/></svg></span>
          <div><h2>Solo el administrador</h2><p class="suave">Las devoluciones y cancelaciones las hace un administrador. Pídele que entre con su usuario.</p></div>
        </div>
      </div>
    </template>

    <template x-if="esAdmin">
      <div class="pila" style="gap: 18px">

        <div class="mensaje aviso" x-show="!puedeRegresarDinero" style="margin: 0">
          <svg class="ico"><use href="/static/iconos.svg#alerta"/></svg>
          <span>
            <template x-if="!cajaId"><span>Esta computadora no tiene caja asignada.</span></template>
            <template x-if="cajaId"><span>La caja <strong x-text="cajaNombre"></strong> no tiene turno abierto.</span></template>
            Puedes consultar ventas, pero para regresar dinero primero <a href="/venta">abre un turno</a>.
          </span>
        </div>

        <div class="mensaje error" x-show="error" style="margin: 0">
          <svg class="ico"><use href="/static/iconos.svg#alerta"/></svg><span x-text="error"></span>
        </div>

        <!-- 1. Buscar la venta -->
        <template x-if="!venta">
          <div class="panel">
            <div class="encabezado">
              <span class="circulo"><svg><use href="/static/iconos.svg#regresar"/></svg></span>
              <div><h2>Devoluciones y cancelaciones</h2><p class="suave">Busca la venta con el folio que viene en el ticket.</p></div>
            </div>
            <form class="fila" style="align-items: stretch" @submit.prevent="buscarFolio()">
              <div class="buscador" style="flex: 1">
                <span class="lupa"><svg><use href="/static/iconos.svg#ticket"/></svg></span>
                <input id="folio" type="number" min="1" x-model="folio" placeholder="Folio del ticket" autocomplete="off">
              </div>
              <button class="primario" style="flex: 0 0 auto; padding: 0 28px; border-radius: var(--radio)">Buscar</button>
            </form>

            <h3 class="separado">Ventas de hoy</h3>
            <div class="lista-ventas">
              <template x-for="v in recientes" :key="v.id">
                <button type="button" class="fila-venta" @click="abrir(v.id)">
                  <span class="folio" x-text="'Folio ' + v.folio"></span>
                  <span class="suave" x-text="hora(v.created_at)"></span>
                  <span><span class="etiqueta peligro" x-show="v.estado === 'cancelada'">Cancelada</span></span>
                  <strong x-text="dinero(v.total)"></strong>
                </button>
              </template>
              <p class="suave" x-show="!recientes.length" style="text-align: center; padding: 16px">Todavía no hay ventas hoy.</p>
            </div>
          </div>
        </template>

        <!-- 2. La venta -->
        <template x-if="venta">
          <div class="panel">
            <div class="fila" style="align-items: flex-start; margin-bottom: 14px">
              <div class="encabezado" style="margin: 0">
                <span class="circulo"><svg><use href="/static/iconos.svg#ticket"/></svg></span>
                <div>
                  <h2>
                    <span x-text="'Folio ' + venta.folio"></span>
                    <span class="etiqueta peligro" x-show="cancelada">Cancelada</span>
                  </h2>
                  <p class="suave"><span x-text="fechaHora(venta.created_at)"></span> · pagó con <span x-text="formaDePago"></span></p>
                </div>
              </div>
              <div class="derecha" style="flex: 0 0 auto">
                <div class="suave" style="font-size: 14px">Total de la venta</div>
                <div style="font-size: 28px; font-weight: 800" x-text="dinero(venta.total)"></div>
              </div>
            </div>

            <!-- Productos de la venta: solo lectura, o para elegir qué regresa -->
            <table class="tabla">
              <thead>
                <tr>
                  <th>Producto</th>
                  <th class="derecha" style="width: 110px">Precio</th>
                  <th class="centro" style="width: 110px">Se llevó</th>
                  <th class="centro" style="width: 230px" x-show="modo === 'devolver'">¿Cuántas regresa?</th>
                </tr>
              </thead>
              <tbody>
                <template x-for="r in venta.renglones" :key="r.id">
                  <tr :class="{ marcada: cuantas(r) > 0 && modo === 'devolver' }">
                    <td>
                      <div class="nombre" x-text="r.nombre"></div>
                      <div class="suave" style="font-size: 14px" x-show="Number(r.cantidad_devuelta) > 0"
                           x-text="`Ya regresó ${cantidad(r.cantidad_devuelta)}`"></div>
                      <template x-if="modo === 'devolver' && cuantas(r) > 0 && lotesPendientes(r).length > 1">
                        <div class="lote">
                          <span>¿De qué lote es la caja?</span>
                          <select x-model="lotes[r.id]">
                            <option value="">No sé</option>
                            <template x-for="l in lotesPendientes(r)" :key="l.lote_id">
                              <option :value="l.lote_id" x-text="textoLote(l)"></option>
                            </template>
                          </select>
                        </div>
                      </template>
                    </td>
                    <td class="derecha" x-text="dinero(r.precio_unitario)"></td>
                    <td class="centro" x-text="cantidad(r.cantidad)"></td>
                    <td class="centro" x-show="modo === 'devolver'">
                      <template x-if="disponible(r) > 0">
                        <div class="fila" style="justify-content: center; gap: 8px">
                          <div class="contador" style="flex: 0 0 auto">
                            <button type="button" @click="cambiar(r, -1)" title="Una menos">−</button>
                            <input type="number" min="0" :max="disponible(r)" step="1" x-model.number="piezas[r.id]" placeholder="0" aria-label="Piezas que regresa">
                            <button type="button" @click="cambiar(r, 1)" title="Una más">+</button>
                          </div>
                          <button type="button" style="flex: 0 0 auto; padding: 8px 10px" @click="todas(r)" x-show="disponible(r) > 1">Todas</button>
                        </div>
                      </template>
                      <span class="suave" x-show="disponible(r) <= 0">Ya se regresó</span>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>

            <!-- Devoluciones anteriores -->
            <template x-if="venta.devoluciones.length">
              <div class="historial">
                <div class="paso">Ya se hizo</div>
                <template x-for="d in venta.devoluciones" :key="d.id">
                  <div class="fila" style="font-size: 15px">
                    <span><strong x-text="textoTipo(d.tipo)"></strong> · <span class="suave" x-text="fechaHora(d.created_at)"></span></span>
                    <span class="suave" x-text="d.motivo"></span>
                    <strong class="derecha" x-text="dinero(d.total)"></strong>
                  </div>
                </template>
              </div>
            </template>

            <div class="mensaje ok" x-show="porRegresar === 0">
              <svg class="ico"><use href="/static/iconos.svg#palomita"/></svg>
              <span x-text="cancelada ? 'Esta venta ya está cancelada; no hay nada más que regresar.' : 'Ya se regresó todo lo de esta venta.'"></span>
            </div>

            <!-- ¿Qué quieres hacer? -->
            <template x-if="!modo && porRegresar > 0">
              <div>
                <div class="paso separado">¿Qué quieres hacer?</div>
                <div class="opciones-grandes">
                  <button type="button" class="opcion-grande" @click="elegirModo('devolver')">
                    <svg><use href="/static/iconos.svg#regresar"/></svg>
                    <strong>Devolver algunos productos</strong>
                    <span>El cliente regresa una parte y se le devuelve lo que costó.</span>
                  </button>
                  <button type="button" class="opcion-grande peligrosa" @click="elegirModo('cancelar')">
                    <svg><use href="/static/iconos.svg#cancelar"/></svg>
                    <strong>Cancelar toda la venta</strong>
                    <span>Se regresa todo: <b x-text="dinero(porRegresar / 100)"></b></span>
                  </button>
                </div>
              </div>
            </template>

            <!-- Motivo y resumen -->
            <template x-if="modo">
              <div>
                <div class="mensaje aviso" x-show="modo === 'cancelar'">
                  <svg class="ico"><use href="/static/iconos.svg#alerta"/></svg>
                  <span>Se cancela la venta completa: todos los productos que falten regresan al inventario y se le devuelve el dinero al cliente.</span>
                </div>
                <div class="mensaje info" x-show="modo === 'devolver' && !piezasElegidas.length">
                  <svg class="ico"><use href="/static/iconos.svg#regresar"/></svg>
                  <span>Marca con <strong>+</strong> cuántas piezas regresa de cada producto.</span>
                </div>

                <div class="paso separado">¿Por qué regresa?</div>
                <div class="chips">
                  <template x-for="m in motivos" :key="m">
                    <button type="button" class="opcion" :class="{ activa: motivo === m }" @click="motivo = m" x-text="m"></button>
                  </template>
                  <button type="button" class="opcion" :class="{ activa: motivo === 'otro' }"
                          @click="motivo = 'otro'; $nextTick(() => document.getElementById('motivo-otro').focus())">Otro motivo</button>
                </div>
                <input id="motivo-otro" x-show="motivo === 'otro'" x-model="motivoOtro" placeholder="Escribe el motivo" style="margin-top: 10px">

                <div class="resumen-dinero separado" x-show="totalARegresar > 0">
                  <div class="fila">
                    <span>Se le regresa al cliente</span>
                    <strong class="derecha" x-text="dinero(totalARegresar / 100)"></strong>
                  </div>
                  <div class="detalle" x-show="reparto.efectivo > 0 && reparto.tarjeta > 0">
                    <span x-text="dinero(reparto.efectivo / 100) + ' en efectivo'"></span> ·
                    <span x-text="dinero(reparto.tarjeta / 100) + ' a su tarjeta'"></span>
                  </div>
                  <div class="detalle" x-show="reparto.tarjeta === 0">En efectivo, de la caja.</div>
                  <div class="detalle" x-show="reparto.efectivo === 0">A su tarjeta (se hace en la terminal).</div>
                </div>

                <div class="fila separado" style="flex-wrap: wrap-reverse">
                  <button type="button" style="flex: 0 0 auto" @click="modo = null">Volver</button>
                  <button type="button" class="grande" :class="modo === 'cancelar' ? 'peligro' : 'primario'"
                          :disabled="!listo" @click="pedirConfirmacion()">
                    <span x-text="modo === 'cancelar' ? 'Cancelar la venta' : 'Hacer la devolución'"></span>
                  </button>
                </div>
                <p class="suave derecha" style="font-size: 14px; margin-top: 8px" x-show="!listo && puedeRegresarDinero">
                  <span x-show="modo === 'devolver' && !piezasElegidas.length">Falta marcar qué productos regresa. </span>
                  <span x-show="!motivoFinal">Falta elegir el motivo.</span>
                </p>
              </div>
            </template>

            <p class="separado" style="margin-bottom: 0">
              <a href="#" @click.prevent="otraVenta()">← Buscar otra venta</a>
            </p>
          </div>
        </template>
      </div>
    </template>
  </main>

  <!-- Confirmación -->
  <div class="velo" x-show="confirmando" x-cloak>
    <div class="panel ventana" x-show="confirmando">
      <template x-if="confirmando">
        <div>
          <h2 x-text="modo === 'cancelar' ? '¿Cancelar la venta completa?' : '¿Hacer la devolución?'"></h2>
          <p class="suave">Folio <strong x-text="venta.folio"></strong> · Motivo: <span x-text="motivoFinal"></span></p>
          <div class="paso" style="margin: 16px 0 0">Se le regresa al cliente</div>
          <div class="cambio-grande" style="color: var(--texto)" x-text="dinero(totalARegresar / 100)"></div>
          <div class="fila separado">
            <button type="button" class="grande" @click="confirmando = false">No, regresar</button>
            <button type="button" id="boton-confirmar" class="grande" :class="modo === 'cancelar' ? 'peligro' : 'primario'"
                    :disabled="procesando" @click="confirmar()">
              <span x-text="procesando ? 'Guardando…' : 'Sí, confirmar'"></span>
            </button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Resultado -->
  <div class="velo" x-show="resultado" x-cloak>
    <div class="panel ventana" x-show="resultado">
      <template x-if="resultado">
        <div>
          <div class="palomita"><svg><use href="/static/iconos.svg#palomita"/></svg></div>
          <h2 x-text="resultado.tipo === 'cancelacion' ? 'Venta cancelada' : 'Devolución hecha'"></h2>
          <p class="suave">Folio <strong x-text="resultado.folio"></strong> · los productos ya regresaron al inventario.</p>
          <template x-if="Number(resultado.efectivo) > 0">
            <div>
              <div class="paso" style="margin: 16px 0 0">Entrega en efectivo</div>
              <div class="cambio-grande" x-text="dinero(resultado.efectivo)"></div>
            </div>
          </template>
          <template x-if="Number(resultado.tarjeta) > 0">
            <div class="mensaje info" style="text-align: left">
              <svg class="ico"><use href="/static/iconos.svg#tarjeta"/></svg>
              <span>Regresa <strong x-text="dinero(resultado.tarjeta)"></strong> a su tarjeta desde la terminal.</span>
            </div>
          </template>
          <button type="button" id="boton-listo" class="primario grande separado" @click="otraVenta()">Listo</button>
        </div>
      </template>
    </div>
  </div>
</body>
</html>
