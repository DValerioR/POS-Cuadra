<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reporte de faltantes · POS</title>
  <link rel="icon" href="/static/app/icono-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/static/app/icono-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/static/app/icono-180.png">
  <link rel="manifest" href="/static/app/manifest.webmanifest">
  <meta name="theme-color" content="#0a4d40">
  <link rel="stylesheet" href="/static/css/pos.css">
  <script src="/static/js/api.js"></script>
  <script>
    // Generador del reporte de faltantes: se elige el proveedor y se descarga
    // el Excel con lo que ese proveedor ha surtido y está en su mínimo o menos,
    // su último costo y, si otro proveedor lo dio más barato, cuál y a cuánto.
    // En otra hoja van los faltantes sin proveedor registrado.
    function pantallaFaltantes() {
      return {
        usuario: null,
        cargando: true,
        error: "",
        proveedores: [],
        proveedor: null,
        generando: false,
        resultado: null,

        async init() {
          try {
            this.usuario = await API.get("/auth/yo");
            if (this.puedeUsar) this.proveedores = await API.get("/proveedores");
          } catch (e) {
            this.error = e.message;
          } finally {
            this.cargando = false;
          }
        },
        get puedeUsar() {
          return this.usuario && (this.usuario.rol === "admin" || this.usuario.rol === "bodega");
        },
        elegir(p) {
          this.proveedor = p;
          this.resultado = null;
          this.error = "";
        },
        async generar() {
          if (!this.proveedor || this.generando) return;
          this.generando = true;
          this.error = "";
          this.resultado = null;
          try {
            const r = await API.get(`/reportes/faltantes?proveedor_id=${this.proveedor.id}`);
            this.resultado = {
              proveedor: r.proveedor,
              productos: r.del_proveedor.length,
              masBaratos: r.del_proveedor.filter((x) => x.mejor_proveedor).length,
              sinProveedor: r.sin_proveedor.length,
            };
            if (this.resultado.productos || this.resultado.sinProveedor) {
              window.location.href = `/reportes/faltantes/excel?proveedor_id=${this.proveedor.id}`;
            }
          } catch (e) {
            this.error = e.message;
          } finally {
            this.generando = false;
          }
        },
        plural(n, uno, varios) {
          return `${n} ${n === 1 ? uno : varios}`;
        },
      };
    }
  </script>
  <script defer src="/static/vendor/alpine-3.17.4.min.js"></script>
</head>
<body x-data="pantallaFaltantes()">

  <header class="barra" data-pagina="faltantes"></header>

  <main class="contenido faltantes" x-cloak x-show="!cargando">
    <template x-if="usuario && !puedeUsar">
      <div class="panel"><div class="encabezado">
        <span class="circulo"><svg><use href="/static/iconos.svg#candado"/></svg></span>
        <div><h2>Sin acceso</h2><p class="suave">Los pedidos los preparan bodega y los administradores.</p></div>
      </div></div>
    </template>

    <template x-if="puedeUsar">
      <div class="panel">
        <div class="encabezado">
          <span class="circulo"><svg><use href="/static/iconos.svg#grafica"/></svg></span>
          <div><h1>Reporte de faltantes</h1>
            <p class="suave">Elige el proveedor y se genera en Excel la lista de lo que hay que pedirle.</p></div>
        </div>

        <div class="paso">1. ¿A qué proveedor le vas a pedir?</div>
        <div class="proveedores-faltantes">
          <template x-for="p in proveedores" :key="p.id">
            <button type="button" class="opcion" :class="{ activa: proveedor && proveedor.id === p.id }" @click="elegir(p)" x-text="p.nombre"></button>
          </template>
          <p class="suave" x-show="!proveedores.length" style="margin: 0">
            Todavía no hay proveedores. Se dan de alta al registrar una entrada de mercancía.
          </p>
        </div>

        <div class="paso separado">2. Genera el reporte</div>
        <button type="button" class="primario grande" :disabled="!proveedor || generando" @click="generar()">
          <svg class="ico"><use href="/static/iconos.svg#grafica"/></svg>
          <span x-text="generando ? 'Generando…' : (proveedor ? `Generar Excel de ${proveedor.nombre}` : 'Generar Excel')"></span>
        </button>

        <div class="mensaje error" x-show="error"><svg class="ico"><use href="/static/iconos.svg#alerta"/></svg><span x-text="error"></span></div>

        <template x-if="resultado && (resultado.productos || resultado.sinProveedor)">
          <div class="mensaje ok">
            <svg class="ico"><use href="/static/iconos.svg#palomita"/></svg>
            <span>
              Listo, se descargó el reporte de <strong x-text="resultado.proveedor"></strong>:
              <span x-text="plural(resultado.productos, 'producto por pedir', 'productos por pedir')"></span><span
                x-show="resultado.masBaratos" x-text="` (${plural(resultado.masBaratos, 'lo dio', 'los dio')} más barato otro proveedor; van en amarillo)`"></span><span
                x-show="resultado.sinProveedor" x-text="` y ${plural(resultado.sinProveedor, 'faltante', 'faltantes')} sin proveedor registrado en otra hoja`"></span>.
            </span>
          </div>
        </template>
        <template x-if="resultado && !resultado.productos && !resultado.sinProveedor">
          <div class="mensaje info">
            <svg class="ico"><use href="/static/iconos.svg#info"/></svg>
            <span>No hay nada que pedirle a <strong x-text="resultado.proveedor"></strong> por ahora.</span>
          </div>
        </template>

        <p class="ayuda" style="margin-top: 16px">
          Entran los productos que ese proveedor ha surtido y están en su mínimo o menos. Para cada uno se sugiere
          pedir hasta su máximo y se compara el último costo de cada proveedor.
        </p>
      </div>
    </template>
  </main>
</body>
</html>
