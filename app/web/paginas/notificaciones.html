<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notificaciones · POS</title>
  <link rel="icon" href="/static/app/icono-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="/static/app/icono-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/static/app/icono-180.png">
  <link rel="manifest" href="/static/app/manifest.webmanifest">
  <meta name="theme-color" content="#0a4d40">
  <link rel="stylesheet" href="/static/css/pos.css">
  <script src="/static/js/api.js"></script>
  <script src="/static/js/notificaciones.js"></script>
  <script defer src="/static/vendor/alpine-3.17.4.min.js"></script>
</head>
<body x-data="pantallaNotificaciones()">

  <header class="barra" data-pagina="notificaciones"></header>

  <main class="contenido notificaciones" x-cloak x-show="!cargando">

    <template x-if="usuario && !esAdmin">
      <div class="panel">
        <div class="encabezado">
          <span class="circulo"><svg><use href="/static/iconos.svg#candado"/></svg></span>
          <div><h2>Solo administradores</h2><p class="suave">Aquí se autorizan devoluciones y se revisan las ventas sin existencia.</p></div>
        </div>
      </div>
    </template>

    <template x-if="esAdmin">
      <div class="pila" style="gap: 18px">
        <div class="encabezado" style="margin: 0">
          <span class="circulo"><svg><use href="/static/iconos.svg#campana"/></svg></span>
          <div>
            <h1>Notificaciones</h1>
            <p class="suave">Lo que necesita a un administrador: devoluciones por autorizar y ventas sin existencia registrada.</p>
          </div>
        </div>

        <div class="mensaje error" x-show="error" style="margin: 0">
          <svg class="ico"><use href="/static/iconos.svg#alerta"/></svg><span x-text="error"></span>
        </div>

        <!-- Sin pendientes -->
        <div class="panel vacio-solicitudes" x-show="!pendientes.length && !avisos.length">
          <svg><use href="/static/iconos.svg#palomita"/></svg>
          <strong>No hay nada pendiente</strong>
          <span class="suave">Cuando un cajero pida una devolución o venda algo que el sistema no tenía, aparecerá aquí y en la campana de arriba, en cualquier pantalla.</span>
        </div>

        <div class="paso" style="margin: 0" x-show="pendientes.length">Devoluciones por autorizar</div>

        <!-- Pendientes, la más vieja primero -->
        <template x-for="s in pendientes" :key="s.id">
          <article class="panel solicitud" :class="{ cancelacion: s.tipo === 'cancelacion' }">
            <div class="cabeza">
              <span class="etiqueta" :class="{ peligro: s.tipo === 'cancelacion' }" x-text="textoTipo(s)"></span>
              <strong x-text="`Folio ${s.folio}`"></strong>
              <span class="suave" x-text="`${s.caja} · pidió ${s.solicitada_por} · ${hace(s.created_at)}`"></span>
            </div>

            <p class="motivo"><span class="suave">Motivo:</span> <strong x-text="s.motivo"></strong></p>

            <template x-if="s.piezas.length">
              <table class="tabla">
                <thead><tr><th>Regresa</th><th class="centro ajustado">Piezas</th><th class="derecha ajustado">Importe</th></tr></thead>
                <tbody>
                  <template x-for="p in s.piezas" :key="p.renglon_id">
                    <tr><td class="nombre" x-text="p.nombre"></td><td class="centro" x-text="cantidad(p.cantidad)"></td><td class="derecha" x-text="dinero(p.importe)"></td></tr>
                  </template>
                </tbody>
              </table>
            </template>
            <p class="suave" x-show="!s.piezas.length">
              Se cancela toda la venta del <span x-text="fecha(s.fecha_venta)"></span> (total <span x-text="dinero(s.total_venta)"></span>);
              todo lo que falte regresa al inventario.
            </p>

            <div class="resumen-dinero">
              <div class="fila"><span>Se le regresa al cliente</span><strong class="derecha" x-text="dinero(s.total)"></strong></div>
              <div class="detalle" x-text="textoDinero(s) + ', desde ' + s.caja"></div>
            </div>

            <!-- Rechazar: pide por qué (opcional) -->
            <template x-if="rechazando === s.id">
              <form class="rechazo" @submit.prevent="rechazar(s)">
                <label :for="`respuesta-${s.id}`" style="margin-top: 0">¿Por qué no? <span class="ayuda">(opcional, lo verá el cajero)</span></label>
                <input :id="`respuesta-${s.id}`" x-model="respuesta" maxlength="200" placeholder="Ej. la caja ya viene abierta">
                <div class="fila">
                  <button type="button" style="flex: 0 0 auto" @click="rechazando = null">Volver</button>
                  <button class="peligro grande" :disabled="procesando === s.id">
                    <span x-text="procesando === s.id ? 'Guardando…' : 'Rechazar la solicitud'"></span>
                  </button>
                </div>
              </form>
            </template>

            <div class="fila acciones" x-show="rechazando !== s.id">
              <button type="button" class="texto-peligro" style="flex: 0 0 auto" :disabled="procesando === s.id" @click="empezarRechazo(s)">
                <svg class="ico"><use href="/static/iconos.svg#tache"/></svg>Rechazar
              </button>
              <button type="button" class="primario grande" :disabled="procesando === s.id" @click="autorizar(s)">
                <svg class="ico"><use href="/static/iconos.svg#palomita"/></svg>
                <span x-text="procesando === s.id ? 'Autorizando…' : 'Autorizar'"></span>
              </button>
            </div>
          </article>
        </template>

        <!-- Ventas sin existencia registrada: una tarjeta por producto -->
        <div class="paso" style="margin: 0" x-show="avisos.length">Ventas sin existencia registrada</div>
        <template x-for="g in productosSinExistencia" :key="g.producto_id">
          <article class="panel solicitud existencia">
            <div class="cabeza">
              <span class="etiqueta">Sin existencia</span>
              <strong x-text="g.producto"></strong>
              <span class="suave" x-text="g.clave || 'sin clave'"></span>
            </div>
            <p class="motivo">
              Se vendieron piezas que el sistema no tenía registradas. Hoy el sistema dice que hay
              <strong x-text="cantidad(g.existencia_actual)"></strong>.
            </p>
            <table class="tabla">
              <thead><tr><th>Venta</th><th class="centro ajustado">Vendidas</th><th class="centro ajustado">Faltaban</th></tr></thead>
              <tbody>
                <template x-for="a in g.ventas" :key="a.id">
                  <tr>
                    <td><strong x-text="`Folio ${a.folio}`"></strong>
                      <span class="suave" x-text="` · ${a.caja} · vendió ${a.vendio} · ${hace(a.created_at)}`"></span></td>
                    <td class="centro" x-text="cantidad(a.vendidas)"></td>
                    <td class="centro" x-text="cantidad(a.faltantes)"></td>
                  </tr>
                </template>
              </tbody>
            </table>
            <form class="conteo" @submit.prevent="contar(g)">
              <label :for="`conteo-${g.producto_id}`">¿Cuántas hay en anaquel ahora? <span class="ayuda">(se ajusta la existencia a ese número)</span></label>
              <div class="fila">
                <input :id="`conteo-${g.producto_id}`" type="number" min="0" step="1" placeholder="0" x-model="conteos[g.producto_id]">
                <button class="primario grande" :disabled="procesando === `p${g.producto_id}`">
                  <svg class="ico"><use href="/static/iconos.svg#palomita"/></svg>
                  <span x-text="procesando === `p${g.producto_id}` ? 'Guardando…' : 'Guardar conteo'"></span>
                </button>
              </div>
            </form>
            <div class="fila acciones">
              <button type="button" class="texto-suave" style="flex: 0 0 auto" :disabled="procesando === `p${g.producto_id}`" @click="yaRevisado(g)">
                Ya lo revisé, no cambiar la existencia
              </button>
            </div>
          </article>
        </template>

        <!-- Ventas sin existencia revisadas hoy -->
        <template x-if="avisosRevisados.length">
          <div class="panel" style="padding: 0; overflow: hidden">
            <div class="paso" style="padding: 16px 18px 0">Ventas sin existencia revisadas hoy</div>
            <table class="tabla">
              <tbody>
                <template x-for="a in avisosRevisados" :key="a.id">
                  <tr>
                    <td class="ajustado"><span class="etiqueta verde">Revisado</span></td>
                    <td>
                      <strong x-text="a.producto"></strong> · <span x-text="`folio ${a.folio}, faltaban ${cantidad(a.faltantes)}`"></span>
                      <div class="suave" style="font-size: 14px"
                           x-text="`${a.revisado_por} a las ${hora(a.revisado_en)}` + (a.conteo !== null ? ` · contó ${cantidad(a.conteo)}` : ' · sin conteo')"></div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>

        <!-- Respondidas hoy -->
        <template x-if="respondidas.length">
          <div class="panel" style="padding: 0; overflow: hidden">
            <div class="paso" style="padding: 16px 18px 0">Devoluciones respondidas hoy</div>
            <table class="tabla">
              <tbody>
                <template x-for="s in respondidas" :key="s.id">
                  <tr>
                    <td class="ajustado">
                      <span class="etiqueta" :class="s.estado === 'autorizada' ? 'verde' : 'peligro'"
                            x-text="s.estado === 'autorizada' ? 'Autorizada' : 'Rechazada'"></span>
                    </td>
                    <td>
                      <strong x-text="`Folio ${s.folio}`"></strong> · <span x-text="textoTipo(s)"></span> · <span x-text="dinero(s.total)"></span>
                      <div class="suave" style="font-size: 14px"
                           x-text="`${s.caja}, pidió ${s.solicitada_por} · ${s.estado === 'autorizada' ? 'autorizó' : 'rechazó'} ${s.resuelta_por} a las ${hora(s.resuelta_en)}` + (s.respuesta ? ` · “${s.respuesta}”` : '')"></div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </template>
      </div>
    </template>
  </main>

  <div class="aviso-flotante" x-show="aviso" x-transition.opacity x-cloak>
    <svg class="ico"><use href="/static/iconos.svg#palomita"/></svg><span x-text="aviso"></span>
  </div>
</body>
</html>
